[build]
  command = "npm run build"
  publish = "dist"

# /<state>/ -> /states/<state>/ redirects are written to dist/_redirects by the build.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    X-Robots-Tag = "noindex"
